services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cforge
      POSTGRES_PASSWORD: cforge
      POSTGRES_DB: cforge
    ports:
      - "5432:5432"
    volumes:
      - cforge_pg:/var/lib/postgresql/data
      # Schema is applied by `npm run provision-roles` (admin) then `npm run migrate`.

  judge:
    build:
      context: ./services/judge
    environment:
      JUDGE_PORT: 7080
      JUDGE_SECRET: ${JUDGE_SECRET:-dev-judge-secret-not-for-production}
      JUDGE_TIME_LIMIT_MS: 2000
      JUDGE_MEMORY_LIMIT_MB: 64
      JUDGE_OUTPUT_LIMIT_BYTES: 65536
      JUDGE_PIDS_LIMIT: 32
      JUDGE_CONFINE: /opt/judge/bin/confine
      JUDGE_REQUIRE_CONFINE: "1"
      JUDGE_STATIC: "1"
      JUDGE_WORKSPACE: /workspace/runs
      TMPDIR: /workspace
      JUDGE_BIND: "0.0.0.0"
    # No host ports. Production / container-to-container uses service DNS http://judge:7080
    # on cforge_internal. Local Mac Next.js uses docker-compose.override.yml (127.0.0.1 only).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /workspace:rw,exec,nosuid,size=64m
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    networks:
      cforge_internal:
        aliases:
          - judge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  cforge_pg:

networks:
  cforge_internal:
    driver: bridge
