# CForge 2F.8.3 — intended local rules. Applied by scripts/apply-pg-hba-scram.mjs.
# __ADMIN__ is replaced with the instance superuser at apply time.
# Do not use trust for CForge roles.

# CForge runtime and migrator — SCRAM on socket, IPv4, IPv6
local   /^cforge   cforge_app,cforge_faculty,cforge_migrator                 scram-sha-256
host    /^cforge   cforge_app,cforge_faculty,cforge_migrator   127.0.0.1/32   scram-sha-256
host    /^cforge   cforge_app,cforge_faculty,cforge_migrator   ::1/128        scram-sha-256

# Legacy / non-login CForge identities
local   all        cforge,cforge_owner,cforge_student                         reject
host    all        cforge,cforge_owner,cforge_student   127.0.0.1/32           reject
host    all        cforge,cforge_owner,cforge_student   ::1/128                reject

# Instance administrator — no password verifier on this role
local   all        __ADMIN__                                                  trust
host    all        __ADMIN__                            127.0.0.1/32          trust
host    all        __ADMIN__                            ::1/128               trust

local   replication  __ADMIN__                                                trust
host    replication  __ADMIN__                          127.0.0.1/32          trust
host    replication  __ADMIN__                          ::1/128               trust
