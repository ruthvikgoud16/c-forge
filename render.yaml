# Same GitHub repo as Vercel. Render builds only backend/.
# Do not apply until the local Postgres dump has been restored.

services:
  - type: web
    name: cforge-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: JUDGE_ALLOW_PRODUCTION
        value: "0"
      - key: JUDGE_URL
        value: ""
      - key: JUDGE_SECRET
        value: ""
      - key: ALLOW_MEMORY_LEARNING
        value: "0"
      - key: ALLOW_DEV_INVITE
        value: "0"
      - key: CFORGE_TRUST_PROXY
        value: "1"
      - key: CFORGE_PUBLIC_ORIGIN
        value: https://cforge.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_APP_URL
        sync: false
      - key: FACULTY_DATABASE_URL
        sync: false
      - key: MIGRATOR_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FACULTY_TOKEN
        sync: false
      - key: CFORGE_VERIFIED_ROSTER_PATH
        value: /etc/secrets/cforge_verified_roster.csv

databases:
  - name: cforge-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: 16
    ipAllowList: []
